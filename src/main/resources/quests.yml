# =================================================================================================================
#  QuestGiver - quests.yml
#  Every quest, transcribed from the design plan's quest catalog. Each level of a quest line is its own quest.
#  Run /quest reload after editing. Broken entries are skipped with a warning in the console, and quests that pay
#  more than the dragon egg bounty ($5,000 / 20 levels) are reported at load time.
#
#  Quest keys
#    name:          display name (colour codes allowed)
#    description:   one line shown in menus (generated from the objectives if left out)
#    pool:          town (offered by town givers with "pool: town" in givers.yml), wandering (wandering givers only),
#                   or any custom pool name to split quests between several town givers
#    event:         seasonal event id from config.yml (e.g. winterfest): the quest only appears while it runs
#    tier:          easy | medium | hard | legendary | bounty. Tiers unlock as players finish quests (config.yml)
#    rarity:        fetch quests only: common | rare | legendary. Rare and legendary ask for confirmation first
#    line / level:  quest lines level up instead of repeating; level N unlocks after level N-1 is finished
#    requires:      quest chains: these quests must be finished before this one is offered
#    squad:         squad-only quest: needs a squad of at least this many members (see squad.* in config.yml)
#    icon:          menu icon (defaults: advancement icon, mob spawn egg, or the fetched item)
#    time-limit-minutes:    real-time limit after accepting (wandering quests default to config.yml's value)
#    bounty-cooldown-days:  makes the quest a repeatable bounty with a per-player cooldown (dragon egg)
#
#  Objectives (a quest is done when every objective is done)
#    {type: advancement, key: story/mine_stone}             earn a vanilla advancement (never offered if owned)
#    {type: kill, entity: skeleton, amount: 3}              entity may be a list; hostile: true = any hostile mob
#        extra flags: night: true (all kills in one night), captain: true (raid/patrol captains),
#                     resummoned: true (only Ender Dragons re-summoned after the first kill)
#    {type: fetch, item: wheat, amount: 64}                 items are taken on turn-in; item may be a list or a
#        group ("#pottery_sherds", or an item tag like "#minecraft:logs"); distinct: true counts different
#        types; with-bees: true needs bee nests with bees inside
#    {type: visit, biomes: [snowy_plains, ice_spikes]}      visit every listed biome
#    {type: breed, entity: goat, amount: 10}  {type: build, entity: snow_golem}  {type: cure, amount: 1}
#    {type: complete, event: winterfest, amount: 6}         finish N other quests of that event (same year)
#    Every objective takes an optional label: "Text" for the progress tracker.
#
#  Rewards
#    money: Vault/EssentialsX money      xp: levels added on top of the current level
#    items: ["bread 16", "enchanted_book efficiency:2", "golden_chestplate protection:5",
#            "potion 3 potion:night_vision", "leather_boots color:red",
#            {item: "iron_sword sharpness:4", name: "&cKrampus's Claw", lore: ["&7..."]},
#            {random: [music_disc_cat, music_disc_13], picks: 2}]
#       Enchantments above the vanilla maximum (Protection V) or on unusual items (Silk Touch shears) are given
#       exactly as written. Reward items are tagged so they can't be handed back in for fetch quests.
#    commands: ["eco give {player} 10"]  console commands; {player}, {uuid}, {quest}
#    reputation: 5                       cosmetic points (defaults by tier in config.yml)
#  The death penalty (config.yml) docks money and XP, never loot.
# =================================================================================================================
