prefix: '&8[&6Quests&8] &7'
general:
  no-permission: '&cYou don''t have permission to do that.'
  players-only: '&cOnly players can use this command.'
  usage: '&cUsage: &f{usage}'
  error: '&cSomething went wrong. Check the server console.'
  data-load-failed: '&cYour quest data could not be loaded. Please try again in a moment.'
help:
  header: '&6&lQuests &7- commands'
  line: ' &e{usage}'
usage:
  help: /quest help
  reload: /quest reload
  giver-create: /quest giver create [id]
  giver-name: /quest giver name <name>
  giver-skin: /quest giver skin <player>
  giver-type: /quest giver type <player|villager>
  giver-move: /quest giver move
  giver-spawn: /quest giver spawn
  giver-despawn: /quest giver despawn
  giver-remove: /quest giver remove
  giver-select: /quest giver select <id>
  giver-list: /quest giver list
  root: /quest
  track: /quest track <quest>
  abandon: /quest abandon <quest>
admin:
  reloaded: '&aReloaded QuestGiver in {ms} ms.'
giver:
  bad-id: '&cGiver ids may only use a-z, 0-9, _ and - (max 32 characters).'
  exists: '&cA giver called &f{giver}&c already exists.'
  created: '&aCreated quest-giver &f{giver}&a here. It is now selected for /quest giver commands.'
  renamed: '&aRenamed &f{giver}&a to &r{name}&a.'
  skin-looking: '&7Looking up the skin of &f{player}&7...'
  skin-set: '&aGave &f{giver}&a the skin of &f{player}&a.'
  skin-failed: '&cCould not find a skin for &f{player}&c.'
  type-set: '&aQuest-giver &f{giver}&a now uses the &f{type}&a model.'
  moved: '&aMoved &f{giver}&a to your position.'
  spawned: '&aSpawned &f{giver}&a at your position.'
  despawned: '&aDespawned &f{giver}&a. Player progress is untouched; use /quest giver spawn to bring it back.'
  removed: '&aRemoved quest-giver &f{giver}&a. Player progress is untouched.'
  selected: '&aSelected quest-giver &f{giver}&a.'
  unknown: '&cThere is no quest-giver called &f{giver}&c.'
  none: '&cThere are no quest-givers yet. Use /quest giver create.'
  select-first: '&cSeveral quest-givers exist. Stand near one or use /quest giver select <id>.'
  list-header: '&6Quest-givers:'
  list-line: ' &e{giver} &7- &r{name} &7({type}, pool {pool}) &8@ {world} {x} {y} {z} &7{state}'
  state-spawned: '&aspawned'
  state-despawned: '&cdespawned'
dialogue:
  format: '&r{giver}&7: &f{line}'
  town:
    greeting:
    - Ah, {player}! Looking for work?
    - Back again, {player}? I've got jobs that need doing.
    - Adventure awaits, {player}. Take your pick.
    offer:
    - This one's yours if you want it.
    - A fine choice. Think you can handle it?
    accept:
    - Excellent! Come back when it's done.
    - Good luck out there, {player}. Don't die... it costs you.
    - I knew I could count on you.
    turn-in:
    - Splendid work, {player}! Here's your reward.
    - You actually did it! Take this, you've earned it.
    - Another job well done. The town thanks you.
    empty-handed:
    - You don't have what I asked for yet, {player}.
    - Come back when you've finished the job.
    - Empty-handed? That won't do.
quest:
  none-active: '&7You have no active quests. Visit a quest-giver to pick one up!'
  list-header: '&6&lYour quests &7({count}/{cap})'
  list-line: ' &e{quest} &8({id})&7: {state}{time}{squad}'
  list-time: ' &8| &e{time} left'
  list-squad: ' &8| &dsquad {squad}'
  state-ready: '&aReady to turn in!'
  not-active: '&cYou don''t have an active quest called &f{quest}&c.'
  tracking: '&aNow tracking &f{quest}&a.'
  abandoned: '&7You abandoned &f{quest}&7.'
  ready: '&a&lQuest complete: &f{quest}&a! Return to &r{giver}&a to claim your reward.'
  town-giver: the town quest-giver
  completed: '&a&lQuest complete! &f{quest}'
  reward-summary: ' &7Reward: &6{money} &7· &b{xp} &7· &f{items} &7· &d+{reputation} reputation'
  reward-penalty: ' &c-{percent}% money and XP for {deaths} death(s) during the quest.'
  reward-repeat: ' &e{percent}% money and XP: you had already finished this quest before.'
  no-items: no items
  death-penalty: '&cYou died with active quests! Their money and XP are now docked up to &f{percent}%&c.'
  biome-visited: '&aDiscovered &f{biome}&a for &f{quest}&a ({have}/{need}).'
  progress-actionbar: '&6{quest} &8» &f{label} &e{have}&7/&e{need}'
  expired: '&cTime''s up! &f{quest}&c has failed.'
  expired-offline: '&cWhile you were away, the time limit on &f{quest}&c ran out.'
  event-ended: '&7The event is over, so &f{quest}&7 was removed.'
progress:
  line: '&7{label}: &e{have}&7/&e{need}'
  line-done: '&a✔ {label}: {have}/{need}'
  advancement: '&7Earn: &e{label}'
  advancement-done: '&a✔ Earned: {label}'
tracker:
  bossbar: '&d{quest} &8» &f{progress}'
  bossbar-ready: '&a{quest} &8» &aReady to turn in!'
  sidebar-title: '&6&l{quest}'
  sidebar-ready: '&aReady to turn in!'
  timer: '&e⌛ {quest} &8- &f{time} left'
menu:
  reward-money: '&6{money}'
  reward-xp: '&b{xp}'
  reward-item: '&f{item}'
  reward-docked: '&c(-{percent}% money/XP for {deaths} death(s))'
event:
  started: '&b&lEvent started: &r{event}&b! Event quests are now on offer at the quest-giver.'
  ended: '&7The &r{event}&7 event has ended.'
squad:
  leader-only: '&cOnly the squad leader can do that.'
  quest-accepted: '&d{leader}&7 accepted &f{quest}&7 for your squad!'
  quest-abandoned: '&d{leader}&7 abandoned the squad quest &f{quest}&7.'
  member-missed-offline: '&e{player}&7 was offline and gets no reward (range check is on).'
  member-missed-range: '&e{player}&7 was too far away and gets no reward.'
  missed-out-of-range: '&cYour squad handed in &f{quest}&c, but you were too far away to share the reward.'
  offline-reward: '&aWhile you were away, your squad &d{squad}&a handed in &f{quest}&a. Here''s your share!'
