dialogue:
  format: '&r{giver}&7: &f{line}'
  town:
    greeting:
    - Ah, {player}! Looking for work?
    - Back again, {player}? I've got jobs that need doing.
    - Adventure awaits, {player}. Take your pick.
    offer:
    - This one's yours if you want it.
    - A fine choice. Think you can handle it?
    accept:
    - Excellent! Come back when it's done.
    - Good luck out there, {player}. Don't die... it costs you.
    - I knew I could count on you.
    turn-in:
    - Splendid work, {player}! Here's your reward.
    - You actually did it! Take this, you've earned it.
    - Another job well done. The town thanks you.
    empty-handed:
    - You don't have what I asked for yet, {player}.
    - Come back when you've finished the job.
    - Empty-handed? That won't do.
    weekly-crit-fail:
    - A natural 1! Did you roll that with your elbow, {player}?
    - Ouch. The dice gods are not with you today.
    - Critical fail! Here's your base reward... and my condolences.
  wanderer:
    greeting:
    - Psst, {player}. I won't be here long.
    - Well met, traveller. I've a job worth your while.
    - I've walked a long road. Perhaps you can help me.
    accept:
    - Then it's yours. Hurry, the hour is short! Report to the town quest-giver.
    - Good. Don't make me regret this, {player}.
    leave:
    - My road calls. Farewell.
    - No takers? Then I'm off.
