# Builds the plugin on every push and pull request, and publishes a GitHub Release with the jar attached when a
# version tag (v1.0.0, v1.2.3, ...) is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep '^version=' gradle.properties | cut -d= -f2)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        run: ./gradlew build -Pversion=${{ steps.version.outputs.version }} --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: QuestGiver-${{ steps.version.outputs.version }}
          path: build/libs/QuestGiver-*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/QuestGiver-*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
